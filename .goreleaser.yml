version: 2

project_name: patchrun

before:
  hooks:
    - go mod tidy

builds:
  - id: patchrun
    main: ./cmd/patchrun
    binary: patchrun
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: patchrun
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

# Pushes Formula/patchrun.rb to alliecatowo/homebrew-tap over SSH with a
# write deploy key (secret HOMEBREW_TAP_DEPLOY_KEY); no PAT needed.
brews:
  - repository:
      owner: alliecatowo
      name: homebrew-tap
      branch: main
      git:
        url: "git@github.com:alliecatowo/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    directory: Formula
    name: patchrun
    homepage: "https://github.com/alliecatowo/patchrun"
    description: "Run any command as a patch before it touches your repo"
    license: "MIT"
    install: |
      bin.install "patchrun"
    test: |
      assert_match "Usage:", shell_output("#{bin}/patchrun --help 2>&1")

release:
  github:
    owner: alliecatowo
    name: patchrun
  draft: false
  prerelease: auto
  name_template: "patchrun {{ .Tag }}"
  header: |
    `patchrun` — run any command as a patch before it touches your repo.

    Install:
    ```bash
    brew install alliecatowo/tap/patchrun
    # or
    go install github.com/alliecatowo/patchrun/cmd/patchrun@{{ .Tag }}
    ```
