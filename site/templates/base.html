<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ config.title }}</title>
<meta name="description" content="{{ config.description }}">
<link rel="stylesheet" href="{{ get_url(path="style.css") }}">
<link rel="stylesheet" href="{{ get_url(path='syntax-light.css') }}" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="{{ get_url(path='syntax-dark.css') }}" media="(prefers-color-scheme: dark)">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ get_url(path='/') }}">patchrun</a>
  <nav>
    <a href="{{ get_url(path='usage') }}">Usage</a>
    <a href="{{ get_url(path='agents') }}">Agents</a>
    <a href="{{ config.extra.repo }}">GitHub</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>MIT licensed · <a href="{{ config.extra.repo }}">source</a></footer>
</body>
</html>
